name: Feature request
description: Propose a focused data-contract capability.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review or CI problem cannot be solved today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include determinism and CLI ergonomics.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Could the feature retain raw values, stable hashes, paths, SQL, or sensitive aggregates?
    validations:
      required: true
